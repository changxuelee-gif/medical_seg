# ============================================================
# 医疗影像分割项目 - 默认配置文件
# ============================================================

# 实验随机种子
seed: 42

# -------------------- 数据配置 --------------------
data:
  # 输入图像尺寸（正方形，宽高相同）
  img_size: 256
  # 输入图像通道数（1=灰度图，3=RGB）
  in_channels: 1
  # 分割类别数（二分类为1，多分类按实际数量设置）
  num_classes: 1
  # 训练集比例
  train_ratio: 0.7
  # 验证集比例
  val_ratio: 0.2
  # 测试集比例（train_ratio + val_ratio + test_ratio = 1）
  test_ratio: 0.1
  # 批大小
  batch_size: 4
  # 数据加载工作线程数
  num_workers: 2
  # 是否对数据进行归一化
  normalize: true
  # 是否启用数据增强
  augment: true

# -------------------- 模型配置 --------------------
model:
  # 模型名称，可选：unet, unetpp (UNet++)
  name: "unetpp"
  # 是否使用双线性插值上采样（False使用转置卷积）
  bilinear: false
  # 是否启用深度监督（仅UNet++支持）
  deep_supervision: false
  # 特征通道数起始倍数
  base_channels: 64

# -------------------- 训练配置 --------------------
training:
  # 训练总轮数
  epochs: 50
  # 初始学习率
  lr: 1.0e-3
  # 权重衰减（L2正则化）
  weight_decay: 1.0e-4
  # Dice损失权重
  dice_weight: 0.5
  # Focal损失权重
  focal_weight: 0.5
  # BCE损失权重（当dice_weight + focal_weight + bce_weight = 1）
  bce_weight: 0.0
  # 早停耐心值（验证集指标不提升的轮数，0表示禁用早停）
  patience: 10
  # 学习率调度器，可选：cosine, step, plateau, none
  scheduler: "cosine"
  # 梯度裁剪阈值（0表示不裁剪）
  grad_clip: 1.0
  # 是否混合精度训练
  amp: false
  # 梯度累积步数
  accumulation_steps: 1
  # 验证频率（每N轮验证一次）
  val_interval: 1
  # 保存检查点频率（每N轮保存一次）
  save_interval: 5

# -------------------- 损失函数配置 --------------------
loss:
  # 损失函数类型，可选：dice, dice_bce, dice_focal, focal
  type: "dice_focal"
  # 是否使用softmax（多分类）或sigmoid（二分类）
  softmax: false
  # Focal Loss的gamma参数（聚焦难分样本，越大越聚焦）
  focal_gamma: 2.0
  # Focal Loss的alpha参数（正样本权重，医疗影像病灶少建议0.7-0.8）
  focal_alpha: 0.8
  # Dice Loss是否加平滑项，防止除零
  dice_smooth: 1.0

# -------------------- 优化器配置 --------------------
optimizer:
  # 优化器类型，可选：adam, adamw, sgd
  type: "adamw"
  # Adam/AdamW的beta1参数
  beta1: 0.9
  # Adam/AdamW的beta2参数
  beta2: 0.999
  # SGD动量参数
  momentum: 0.9

# -------------------- 路径配置 --------------------
paths:
  # 数据目录（默认使用模拟数据目录，自定义数据集请修改此路径）
  data_dir: "data/raw/simulated"
  # 检查点保存目录
  checkpoint_dir: "checkpoints"
  # 日志目录
  log_dir: "logs"
  # 输出目录（预测结果、可视化等）
  output_dir: "outputs"

# -------------------- 日志与可视化配置 --------------------
logging:
  # 日志级别：DEBUG, INFO, WARNING, ERROR
  level: "INFO"
  # 是否使用TensorBoard
  tensorboard: true
  # 是否打印模型信息
  print_model: true
  # 是否打印进度条
  progress_bar: true
